name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Demo runs end to end
        working-directory: examples
        run: |
          uv run ratchet --app demo.py:engine start demo '"Durable execution"' --id a1
          uv run ratchet --app demo.py:engine signal a1 outline.ok '{"decision": "go on"}'
          uv run ratchet --app demo.py:engine tick
          uv run ratchet --app demo.py:engine show a1 | grep -q completed

      - name: The real example loads (it spends tokens, so it does not run here)
        working-directory: examples
        run: ARTICLE_WORK=$RUNNER_TEMP/article uv run ratchet --app article.py:engine runs

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests examples
      - name: Mypy
        run: uv run mypy

  agent-sdk:
    name: Agent SDK adapter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install with the Agent SDK
        run: uv sync --locked --group agent-sdk
      - name: Test
        run: uv run pytest -q tests/test_claude_sdk_agent.py

  build:
    name: Build the package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: The wheel installs and imports with no dependencies
        run: |
          uv venv /tmp/check
          uv pip install --python /tmp/check dist/*.whl
          /tmp/check/bin/python -c "import ratchetflow, ratchetflow.agents; print(ratchetflow.__version__)"
          /tmp/check/bin/ratchet --help > /dev/null
      - name: The sdist holds only the package, its tests and its docs
        run: |
          extra=$(tar tzf dist/*.tar.gz | cut -d/ -f2- | grep -vE '^(src/ratchetflow/|tests/|examples/demo\.py$|README\.md$|CHANGELOG\.md$|CONTRIBUTING\.md$|LICENSE$|PKG-INFO$|pyproject\.toml$|\.gitignore$|$)' || true)
          if [ -n "$extra" ]; then echo "unexpected files in the sdist:"; echo "$extra"; exit 1; fi
