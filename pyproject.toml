[project]
name = "ratchetflow"
version = "0.2.0"
description = "Durable steps for long-running agent workflows: a crash costs one step, not the run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paco Fernández" }]
keywords = ["durable execution", "workflow", "agents", "llm", "claude", "codex", "sqlite", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=2.10"]
agent-sdk = ["claude-agent-sdk>=0.2.185"]

[project.urls]
Homepage = "https://github.com/fjfdepedro/ratchetflow"
Repository = "https://github.com/fjfdepedro/ratchetflow"
Issues = "https://github.com/fjfdepedro/ratchetflow/issues"
Changelog = "https://github.com/fjfdepedro/ratchetflow/blob/main/CHANGELOG.md"

[project.scripts]
ratchet = "ratchetflow.cli:entry"

[dependency-groups]
agent-sdk = [
    "claude-agent-sdk>=0.2.185",
]
dev = [
    "anthropic>=2.10.0",
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchetflow"]

# A closed list: anything else in the working tree (local notes, lock file, CI config) stays out,
# even when the package is built from a checkout that has untracked files.
[tool.hatch.build.targets.sdist]
only-include = ["src/ratchetflow", "tests", "examples/demo.py", "README.md", "CHANGELOG.md",
                "CONTRIBUTING.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["claude_agent_sdk", "claude_agent_sdk.*"]   # optional extra, not installed in CI's lint job
ignore_missing_imports = true
